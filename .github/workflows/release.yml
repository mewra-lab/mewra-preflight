name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing SemVer tag to publish, for example v0.2.0
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-github-release:
    name: Package and publish GitHub Release
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.3.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          if [[ "v$package_version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $package_version"
            exit 1
          fi

      - name: Run quality gate
        run: pnpm validate

      - name: Package VSIX
        run: pnpm package

      - name: Create checksum
        run: |
          vsix="mewra-preflight-${RELEASE_TAG#v}.vsix"
          test -f "$vsix"
          sha256sum "$vsix" > SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="mewra-preflight-${RELEASE_TAG#v}.vsix"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$vsix" SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" "$vsix" SHA256SUMS.txt --verify-tag --generate-notes --title "$RELEASE_TAG"
          fi
